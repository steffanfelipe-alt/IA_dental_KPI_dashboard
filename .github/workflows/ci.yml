# CI: lints the parser (informational) and runs the OFFLINE parser test suite.
# Only tests that pass with no Claude API key and never read the gitignored
# parser/datos_clinica_real/ are run here; real-API tests live in tests-api.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff

      # LINT is INFORMATIONAL, not blocking: the parser has never been linted,
      # so failing every PR on pre-existing style debt would be impractical.
      # To make linting a hard gate later, delete the `continue-on-error` line.
      - name: Lint (ruff, informational)
        continue-on-error: true
        run: ruff check parser

      # OFFLINE test allowlist (explicit, not a glob). Each parser/**/test_*.py is a
      # standalone runner (no pytest), invoked as a package module: a nonzero
      # exit means a test failed. `set -e` stops the job at the first failing test.
      - name: Run offline test suite
        run: |
          set -euo pipefail
          tests=(
            parser.cobertura_calidad.test_agregados
            parser.diagnostico.test_benchmarks
            parser.diagnostico.test_calidad
            parser.catalogo.test_catalogo_tecnologico
            parser.cobertura_calidad.test_conflictos
            parser.cobertura_calidad.test_coverage
            parser.catalogo.test_cruces
            parser.catalogo.test_cruces_propuestos
            parser.cobertura_calidad.test_derivacion
            parser.diagnostico.test_diagnostico
            parser.diagnostico.test_evals_diagnostico
            parser.extraccion.test_excel_parser
            parser.interpretacion.test_explicaciones
            parser.vocabulario.test_formato
            parser.interpretacion.test_interpretacion
            parser.pacientes.test_ledger
            parser.pacientes.test_matching
            parser.pacientes.test_metricas_paciente
            parser.vocabulario.test_periodos
            parser.test_pipeline
            parser.diagnostico.test_priorizacion_extendida
            parser.cobertura_calidad.test_reconciliacion
            parser.extraccion.test_segunda_lectura
            parser.cobertura_calidad.test_trazabilidad
            parser.cobertura_calidad.test_validacion
            parser.extraccion.test_vision_parser
          )
          for t in "${tests[@]}"; do
            echo "::group::$t"
            python -m "$t"
            echo "::endgroup::"
          done
